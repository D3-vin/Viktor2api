<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Viktor2api</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #0d1117;
      color: #c9d1d9;
    }

    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid #21262d;
    }
    .header-title { font-size: 15px; font-weight: 600; color: #e6edf3; }
    .header-sub   { font-size: 11px; color: #8b949e; }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid #21262d; }
    .tab-btn {
      flex: 1; padding: 8px; border: none; background: none;
      color: #8b949e; font-size: 12px; font-weight: 500;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color .15s;
    }
    .tab-btn:hover { color: #c9d1d9; }
    .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Fields */
    .section { padding: 10px 16px 0; }
    .field {
      background: #161b22; border: 1px solid #21262d;
      border-radius: 6px; padding: 8px 10px; margin-bottom: 6px;
    }
    .field-label { font-size: 11px; color: #8b949e; margin-bottom: 2px; }
    .field-value {
      font-family: monospace; font-size: 12px; color: #79c0ff;
      word-break: break-all; min-height: 16px;
    }
    .field-value.empty { color: #484f58; font-style: italic; }
    .field-value.ok    { color: #56d364; }

    /* Buttons */
    .btn-row { display: flex; gap: 6px; padding: 8px 16px; }
    button {
      flex: 1; padding: 7px 10px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity .15s;
    }
    button:hover  { opacity: .85; }
    button:active { opacity: .7; }
    button:disabled { opacity: .35; cursor: default; }
    .btn-blue  { background: #1f6feb; color: #fff; }
    .btn-green { background: #238636; color: #fff; }
    .btn-gray  { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .btn-small { font-size: 11px; padding: 5px 8px; }

    /* Status */
    .status {
      margin: 0 16px 8px; padding: 7px 10px; border-radius: 6px;
      font-size: 12px; background: #161b22; border: 1px solid #21262d;
      color: #8b949e; min-height: 30px;
    }
    .status.ok  { border-color: #238636; color: #56d364; }
    .status.err { border-color: #da3633; color: #f85149; }
    .status.run { border-color: #1f6feb; color: #79c0ff; }

    /* Proxy row */
    .proxy-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px; border-top: 1px solid #21262d;
    }
    .proxy-label { color: #8b949e; font-size: 11px; }
    .proxy-badge { font-size: 11px; }
    .proxy-badge.online  { color: #56d364; }
    .proxy-badge.offline { color: #f85149; }
    input.port-input {
      width: 56px; background: #161b22; border: 1px solid #30363d;
      border-radius: 4px; color: #c9d1d9; font-size: 12px;
      padding: 3px 6px; outline: none;
    }
    .hint { font-size: 11px; color: #484f58; padding: 0 16px 8px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="header">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="11" fill="#1f6feb"/>
    <path d="M7 12h10M7 12l3-3M7 12l3 3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
  <div>
    <div class="header-title">Viktor2api</div>
    <div class="header-sub">Config Extractor</div>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab-btn active" data-tab="slack">📨 Slack</button>
  <button class="tab-btn" data-tab="jwt">🔑 JWT</button>
</div>

<!-- ═══ TAB: SLACK ═══ -->
<div class="tab-pane active" id="tab-slack">
  <div class="section">
    <div class="field">
      <div class="field-label">slack_token (xoxc)</div>
      <div class="field-value empty" id="v-token">not read</div>
    </div>
    <div class="field">
      <div class="field-label">slack_cookie_d (xoxd)</div>
      <div class="field-value empty" id="v-cookie">not read</div>
    </div>
    <div class="field">
      <div class="field-label">viktor_dm (D…)</div>
      <div class="field-value empty" id="v-dm">not read</div>
    </div>
    <div class="field">
      <div class="field-label">viktor_user (U…)</div>
      <div class="field-value empty" id="v-user">not read</div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn-blue" id="btnDetectSlack">🔍 Read</button>
  </div>
  <div class="btn-row">
    <button class="btn-gray btn-small" id="btnCopySlack" disabled>📋 Copy</button>
    <button class="btn-green btn-small" id="btnSendSlack" disabled>📤 Send to proxy</button>
  </div>
</div>

<!-- ═══ TAB: JWT ═══ -->
<div class="tab-pane" id="tab-jwt">
  <div class="section">
    <div class="field">
      <div class="field-label">jwt (eyJ…)</div>
      <div class="field-value empty" id="v-jwt">not read</div>
    </div>
  </div>
  <div class="hint">Open app.viktor.com, then click Read</div>
  <div class="btn-row">
    <button class="btn-blue" id="btnDetectJwt">🔍 Read JWT</button>
  </div>
  <div class="btn-row">
    <button class="btn-gray btn-small" id="btnCopyJwt" disabled>📋 Copy</button>
    <button class="btn-green btn-small" id="btnSendJwt" disabled>📤 Send to proxy</button>
  </div>
</div>

<!-- Status (shared) -->
<div class="status" id="status">Select a tab and click Read</div>

<!-- Account name row -->
<div class="proxy-row">
  <span class="proxy-label">Account</span>
  <input class="port-input" id="acctNameInput" value="default" style="width:120px;flex:1;margin:0 4px" placeholder="account name">
</div>

<!-- Proxy row -->
<div class="proxy-row">
  <span class="proxy-label">Proxy</span>
  <span class="proxy-badge" id="proxyBadge">—</span>
  <input class="port-input" id="portInput" value="6061">
</div>

<script src="popup.js"></script>
</body>
</html>
